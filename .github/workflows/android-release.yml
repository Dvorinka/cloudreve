name: Android Release

# Tag `android-v*` builds the release APK + AAB and publishes them to a
# GitHub release. If ANDROID_KEYSTORE_* secrets are configured the
# artifacts are signed with the real release key; otherwise the debug
# cert is used so APKs remain sideload-installable.
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        # KERN runners each ship a single Temurin (17 on some hosts, 21 on
        # others) and the egress proxy 403s setup-java's remote version
        # lookup, so any pinned java-version fails on the runner that lacks
        # it. Use the JDK already installed on the host; AGP 8.9 / Gradle
        # 8.11 run on both 17 and 21.
        run: |
          set -e
          if ! command -v java >/dev/null 2>&1; then
            for bindir in /usr/lib/jvm/*/bin /usr/java/*/bin \
                "$RUNNER_TOOL_CACHE"/*/*/x64/bin "$RUNNER_TOOL_CACHE"/*/*/bin; do
              if [ -x "$bindir/java" ]; then
                export PATH="$bindir:$PATH"
                echo "$bindir" >> "$GITHUB_PATH"
                break
              fi
            done
          fi
          java -version
          echo "JAVA_HOME=$(cd "$(dirname "$(command -v java)")/.." && pwd)" >> "$GITHUB_ENV"

      - name: Ensure Gradle home is writable
        # KERN's shared /kern/cache/gradle can be root-owned; setup-gradle
        # writes init.d scripts into GRADLE_USER_HOME and dies on EACCES.
        run: |
          gh="${GRADLE_USER_HOME:-$HOME/.gradle}"
          chmod -R a+rwX "$gh" 2>/dev/null || sudo -n chmod -R a+rwX "$gh" || true
          mkdir -p "$gh/init.d"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build release APK + AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name 'app-release*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name 'app-release*.aab' | head -1)
          cp "$APK" "cloudreve-${{ github.ref_name }}.apk"
          cp "$AAB" "cloudreve-${{ github.ref_name }}.aab"
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            SIG_NOTE="Signed with the release key."
          else
            SIG_NOTE="Signed with the debug certificate — sideload-installable. Configure the ANDROID_KEYSTORE_* secrets to sign with a release key."
          fi
          gh release create "${{ github.ref_name }}" \
            --title "Cloudreve Android ${{ github.ref_name }}" \
            --notes "Cloudreve Android app. ${SIG_NOTE}" \
            "cloudreve-${{ github.ref_name }}.apk" \
            "cloudreve-${{ github.ref_name }}.aab"
