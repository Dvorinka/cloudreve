name: Release

# One `v*` tag produces ONE GitHub release containing every platform:
#   - server binaries + archives + checksums (GoReleaser) + GHCR docker images
#   - desktop bundles: Linux .deb/.AppImage, Windows NSIS .exe, macOS .dmg/.app.tar.gz
#   - Android release APK + AAB (signed with ANDROID_KEYSTORE_* secrets when set)
# The desktop-* / android-v* tags still exist for platform-only releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

# Never cancel an in-flight release — a canceled run can leave the
# GitHub release half-populated. Re-tags queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Create the GitHub release up front: the server job (GoReleaser + qemu
  # image builds) is by far the slowest, so every other job's publish step
  # would otherwise poll `gh release view` for ~30min and fail
  # `release not found`. GoReleaser uploads into an existing release.
  prepare:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes \
              --title "Cloudreve $TAG"
          fi

  server:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # GHCR rejects GitHub App installation tokens (ghs_*) — GITHUB_TOKEN on
      # KERN is one. GHCR_TOKEN is a classic PAT with write:packages.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      # The Dockerfile's apk layer floats (unpinned packages), so every
      # release writes ~GBs of fresh buildkit layers on the shared runner
      # daemon. Reclaim before building or the daemon hits ENOSPC mid-apk.
      - name: Reclaim docker disk
        run: |
          docker system df || true
          for b in $(docker buildx ls --format '{{.Name}}'); do
            docker buildx prune --builder "$b" -af || true
          done
          docker builder prune -af || true
          docker container prune -f || true
          docker image prune -f || true
          docker system df || true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # KERN runners OOM-killed parallel `go build` compiles
          # (signal: killed) when goreleaser builds all 11 targets;
          # cap package parallelism and give the GC a soft limit.
          GOFLAGS: "-p=4"
          GOMEMLIMIT: "4GiB"
      # Leave the host clean for the next job — built image layers and
      # buildkit cache are dead weight once pushed to GHCR.
      - name: Reclaim docker disk
        if: always()
        run: |
          for b in $(docker buildx ls --format '{{.Name}}'); do
            docker buildx prune --builder "$b" -af || true
          done
          docker builder prune -af || true
          docker image prune -f || true

  desktop:
    strategy:
      fail-fast: false
      matrix:
        ro: [[self-hosted, linux, x64], [self-hosted, windows, x64], [self-hosted, macos, x64]]
    runs-on: ${{ matrix.ro }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: desktop/ui/yarn.lock

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev patchelf libfuse2 fuse3

      - name: Install UI dependencies
        working-directory: desktop/ui
        run: yarn install --frozen-lockfile

      # Build + sign the sparse identity package that gives the NSIS-installed
      # app package identity (Explorer context menu, packaged COM) without
      # Developer Mode. The msix lands in package/ next to the committed
      # cloudreve-identity.cer and the NSIS hook (installer-hooks.nsh) files
      # them into $INSTDIR when present. Same step as desktop-release.yml.
      - name: Build signed sparse identity package
        if: runner.os == 'Windows'
        # KERN's host executor has no pwsh shell — run the script through
        # powershell.exe from a bash step instead.
        shell: bash
        env:
          SPARSE_SIGNING_PFX_BASE64: ${{ secrets.SPARSE_SIGNING_PFX_BASE64 }}
          SPARSE_SIGNING_PFX_PASSWORD: ${{ secrets.SPARSE_SIGNING_PFX_PASSWORD }}
        run: |
          cat > sparse-identity.ps1 <<'PS1EOF'
          $ErrorActionPreference = 'Stop'
          $ver = (Select-String -Path desktop/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($ver.Split('.').Count -eq 3) { $ver = "$ver.0" }

          $stage = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\sparse-pkg"
          $manifest = Get-Content desktop/package/AppxManifest.sparse.xml -Raw
          $manifest = $manifest -replace '__VERSION__', $ver -replace '__ARCH__', 'x64'
          [IO.File]::WriteAllText("$stage\AppxManifest.xml", $manifest, (New-Object System.Text.UTF8Encoding $true))
          Copy-Item desktop/package/Images "$stage\Images" -Recurse

          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object { $_.FullName } | Select-Object -Last 1
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object { $_.FullName } | Select-Object -Last 1
          & $makeappx.FullName pack /o /d $stage /nv /p "$env:RUNNER_TEMP\Cloudreve-Identity.msix"
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

          $pfx = "$env:RUNNER_TEMP\sparse-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SPARSE_SIGNING_PFX_BASE64))
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SPARSE_SIGNING_PFX_PASSWORD "$env:RUNNER_TEMP\Cloudreve-Identity.msix"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }

          Copy-Item "$env:RUNNER_TEMP\Cloudreve-Identity.msix" desktop/package/Cloudreve-Identity.msix -Force
          PS1EOF
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File sparse-identity.ps1

      # taiki-e/install-action is a composite action; KERN's composite runner
      # only accepts bare interpreter paths for `shell:`, so fetch the pinned
      # cargo-tauri binary directly instead.
      - name: Install tauri-cli (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) asset="cargo-tauri-x86_64-unknown-linux-gnu.tgz" ;;
            macOS) asset="cargo-tauri-x86_64-apple-darwin.zip" ;;
            *) echo "unsupported OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          tmp="$RUNNER_TEMP/tauri-cli"
          mkdir -p "$tmp/bin"
          curl -fsSL "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.4/$asset" -o "$tmp/$asset"
          case "$asset" in
            *.tgz) tar -xzf "$tmp/$asset" -C "$tmp" ;;
            *.zip) unzip -o "$tmp/$asset" -d "$tmp" ;;
          esac
          mv "$tmp/cargo-tauri" "$tmp/bin/"
          echo "$tmp/bin" >> "$GITHUB_PATH"

      # Windows has no unzip; bsdtar handles the zip. bash is used because
      # KERN's host executor has no pwsh support.
      - name: Install tauri-cli (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          asset="cargo-tauri-x86_64-pc-windows-msvc.zip"
          tmp="$RUNNER_TEMP/tauri-cli"
          mkdir -p "$tmp/bin"
          curl -fsSL "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.4/$asset" -o "$tmp/$asset"
          # Git Bash's tar is GNU tar (no zip support, treats C: as a remote
          # host). bsdtar from System32 handles both zip and drive paths.
          "C:/Windows/System32/tar.exe" -xf "$tmp/$asset" -C "$tmp"
          mv "$tmp/cargo-tauri.exe" "$tmp/bin/"
          echo "$tmp/bin" >> "$GITHUB_PATH"

      - name: Build desktop bundles
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      - name: Publish bundles to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          for _ in $(seq 1 90); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 20
          done
          # The prepare job normally created this already; create as a
          # fallback so a prepare failure doesn't cascade into every leg.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --generate-notes --title "Cloudreve $TAG"
          FILES=$(find desktop/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.exe' -o -name '*.dmg' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \))
          [ -n "$FILES" ]
          echo "$FILES" | while read -r f; do
            name="cloudreve-desktop-$(basename "$f")"
            cp "$f" "$name"
            gh release upload "$TAG" "$name" --clobber
          done

  updater-manifest:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p sigs
          gh release download "$TAG" -p '*.sig' -D sigs --clobber
          python3 desktop/scripts/gen_latest_json.py "$TAG" sigs latest.json
          gh release upload "$TAG" latest.json --clobber

  android:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        # KERN runners each ship a single Temurin (17 on some hosts, 21 on
        # others) and the egress proxy 403s setup-java's remote version
        # lookup, so any pinned java-version fails on the runner that lacks
        # it. Use the JDK already installed on the host; AGP 8.9 / Gradle
        # 8.11 run on both 17 and 21.
        run: |
          set -e
          if ! command -v java >/dev/null 2>&1; then
            for bindir in /usr/lib/jvm/*/bin /usr/java/*/bin \
                "$RUNNER_TOOL_CACHE"/*/*/x64/bin "$RUNNER_TOOL_CACHE"/*/*/bin; do
              if [ -x "$bindir/java" ]; then
                export PATH="$bindir:$PATH"
                echo "$bindir" >> "$GITHUB_PATH"
                break
              fi
            done
          fi
          java -version
          echo "JAVA_HOME=$(cd "$(dirname "$(command -v java)")/.." && pwd)" >> "$GITHUB_ENV"

      - name: Configure Gradle home
        # KERN exports GRADLE_USER_HOME=/kern/cache/gradle, but on some
        # runner hosts that tree is root-owned and uid-1000 jobs get EACCES
        # when setup-gradle writes init.d. Use a writable per-job home,
        # seed the same fleet mirror init script, and keep the warm
        # dependency cache read-only via GRADLE_RO_DEP_CACHE when present.
        run: |
          set -e
          gh="$RUNNER_TEMP/gradle-home"
          mkdir -p "$gh/init.d"
          cat > "$gh/init.d/kern-mirror.init.gradle" <<'GRADLE_INIT_EOF'
          // KERN-managed: fleet Maven Central mirror. Do not edit — the runner
          // rewrites this file on every job.
          // Inserted FIRST everywhere Gradle resolves artifacts so repo.maven.apache.org
          // becomes the fallback, not the default. Nothing is removed.
          // KERN_MAVEN_MIRROR overrides the URL (e.g. a LAN pull-through cache).
          def mirrorUrl = System.getenv('KERN_MAVEN_MIRROR') ?: 'https://maven-central.storage-download.googleapis.com/maven2/'
          def addMirror
          addMirror = { repos ->
              if (repos.findByName('kern-central-mirror') == null) {
                  // allowInsecureProtocol: the fleet LAN pull-through mirror is
                  // plain http on the trusted segment; Gradle >= 7 refuses http
                  // repos without the opt-in or every resolve fails outright.
                  repos.maven { url mirrorUrl; name 'kern-central-mirror'; allowInsecureProtocol = true }
                  def repo = repos.findByName('kern-central-mirror')
                  repos.remove(repo)
                  repos.add(0, repo)
              }
          }
          gradle.settingsEvaluated { settings ->
              try { addMirror(settings.pluginManagement.repositories) } catch (Throwable ignored) {}
              try { addMirror(settings.dependencyResolutionManagement.repositories) } catch (Throwable ignored) {}
              def mode = ''
              try { mode = settings.dependencyResolutionManagement.repositoriesMode.get().name() } catch (Throwable ignored) {}
              if (mode != 'FAIL_ON_PROJECT_REPOS') {
                  settings.gradle.projectsLoaded {
                      settings.gradle.rootProject { root ->
                          root.allprojects { p ->
                              addMirror(p.buildscript.repositories)
                              addMirror(p.repositories)
                          }
                      }
                  }
              }
          }
          GRADLE_INIT_EOF
          echo "GRADLE_USER_HOME=$gh" >> "$GITHUB_ENV"
          if [ -d /kern/cache/gradle/caches/modules-2 ]; then
            echo "GRADLE_RO_DEP_CACHE=/kern/cache/gradle/caches/modules-2" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build release APK + AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      - name: Publish APK + AAB to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          for _ in $(seq 1 90); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --generate-notes --title "Cloudreve $TAG"
          APK=$(find app/build/outputs/apk/release -name 'app-release*.apk' | head -1)
          AAB=$(find app/build/outputs/bundle/release -name 'app-release*.aab' | head -1)
          cp "$APK" "cloudreve-android-${TAG}.apk"
          cp "$AAB" "cloudreve-android-${TAG}.aab"
          gh release upload "$TAG" \
            "cloudreve-android-${TAG}.apk" \
            "cloudreve-android-${TAG}.aab" --clobber
