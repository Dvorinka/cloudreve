version: 2

project_name: cloudreve

before:
  hooks:
    - go mod tidy
    - chmod +x ./.build/build-assets.sh
    - ./.build/build-assets.sh {{.Version}}

builds:
  - env:
      - CGO_ENABLED=0

    binary: cloudreve

    ldflags:
      - -s -w
      - -X 'github.com/cloudreve/Cloudreve/v4/application/constants.BackendVersion={{.Version}}' -X 'github.com/cloudreve/Cloudreve/v4/application/constants.LastCommit={{.ShortCommit}}'

    goos:
      - linux
      - windows
      - darwin
      - freebsd

    goarch:
      - amd64
      - arm
      - arm64
      - loong64

    goarm:
      - 5
      - 6
      - 7

    ignore:
      - goos: windows
        goarm: 5
      - goos: windows
        goarm: 6
      - goos: windows
        goarm: 7
      - goos: windows
        goarch: loong64
      - goos: freebsd
        goarch: loong64
      - goos: freebsd
        goarch: arm

archives:
  - formats: ["tar.gz"]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      cloudreve_{{.Tag}}_{{- .Os }}_{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
  # The prepare job creates the release before this runs, so this is only
  # a fallback. A commit SHA is the unambiguous valid commitish — a tag
  # name got a 422 `target_commitish invalid` when the lookup missed a
  # draft release (v4.23.16).
  target_commitish: "{{ .Commit }}"
  name_template: "{{.Version}}"

# GHCR image builds intentionally live OUTSIDE goreleaser: the release
# workflow's `images` matrix builds the four variants in parallel via
# .build/build-image.sh (docker buildx), and `publish-images` recreates
# the multi-arch manifests + floating tags. goreleaser's docker pipes
# cannot be partially skipped (docker_manifests has no --skip name), so
# keeping them here would double-build every CI release. For a local
# image build, run .build/build-image.sh per variant after `goreleaser
# release` has produced dist/.
