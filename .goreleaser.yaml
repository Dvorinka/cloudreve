version: 2

project_name: cloudreve

before:
  hooks:
    - go mod tidy
    - chmod +x ./.build/build-assets.sh
    - ./.build/build-assets.sh {{.Version}}

builds:
  - env:
      - CGO_ENABLED=0

    binary: cloudreve

    ldflags:
      - -s -w
      - -X 'github.com/cloudreve/Cloudreve/v4/application/constants.BackendVersion={{.Version}}' -X 'github.com/cloudreve/Cloudreve/v4/application/constants.LastCommit={{.ShortCommit}}'

    goos:
      - linux
      - windows
      - darwin
      - freebsd

    goarch:
      - amd64
      - arm
      - arm64
      - loong64

    goarm:
      - 5
      - 6
      - 7

    ignore:
      - goos: windows
        goarm: 5
      - goos: windows
        goarm: 6
      - goos: windows
        goarm: 7
      - goos: windows
        goarch: loong64
      - goos: freebsd
        goarch: loong64
      - goos: freebsd
        goarch: arm

archives:
  - formats: ["tar.gz"]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      cloudreve_{{.Tag}}_{{- .Os }}_{{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
  # Do not pin a SHA: GitHub's releases API 403s app/integration tokens
  # when target_commitish is a commit SHA (KERN's GITHUB_TOKEN). The tag
  # exists before this runs, so the release attaches to it regardless.
  target_commitish: "{{ .Tag }}"
  name_template: "{{.Version}}"

dockers:
  - dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--provenance=false"
    goos: linux
    goarch: amd64
    goamd64: v1
    extra_files:
      - .build/aria2.supervisor.conf
      - .build/entrypoint.sh
    image_templates:
      - "ghcr.io/dvorinka/cloudreve:{{ .Tag }}-amd64"
  - dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--provenance=false"
    goos: linux
    goarch: arm64
    extra_files:
      - .build/aria2.supervisor.conf
      - .build/entrypoint.sh
    image_templates:
      - "ghcr.io/dvorinka/cloudreve:{{ .Tag }}-arm64"
  - dockerfile: Dockerfile.slim
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--provenance=false"
    goos: linux
    goarch: amd64
    goamd64: v1
    image_templates:
      - "ghcr.io/dvorinka/cloudreve:{{ .Tag }}-slim-amd64"
  - dockerfile: Dockerfile.slim
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--provenance=false"
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/dvorinka/cloudreve:{{ .Tag }}-slim-arm64"

# Floating tags (latest, v4, slim) are deliberately NOT manifests here.
# GoReleaser re-points them on every run, so re-releasing an old tag drags
# `latest` backwards (2026-11-10: a v4.23.8 re-release overwrote latest
# with 4.23.8 while v4.23.12 was current). .build/retag-floating.sh owns
# them and only moves them when the released tag is the newest v* tag.
docker_manifests:
  - name_template: "ghcr.io/dvorinka/cloudreve:{{ .Tag }}"
    image_templates:
      - "ghcr.io/dvorinka/cloudreve:{{ .Tag }}-amd64"
      - "ghcr.io/dvorinka/cloudreve:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/dvorinka/cloudreve:{{ .Tag }}-slim"
    image_templates:
      - "ghcr.io/dvorinka/cloudreve:{{ .Tag }}-slim-amd64"
      - "ghcr.io/dvorinka/cloudreve:{{ .Tag }}-slim-arm64"
